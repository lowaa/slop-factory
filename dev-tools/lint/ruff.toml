# ruff's rules for every Python project (ruff.sh passes this with --config,
# so a project's own [tool.ruff] does not apply). Lint only: formatting is
# not checked, and pyright stays the type checker. README.md says why each
# group is here and why the threshold is 15.
[lint]
select = [
  "E4", "E7", "E9", "F", # ruff's defaults: pyflakes (unused imports and variables among them) and the pycodestyle errors
  "B",                   # bugbear: late-bound loop variables, `raise` without `from`, mutable defaults
  "C901",                # cyclomatic complexity
  "ERA",                 # commented-out code
  "ARG001", "ARG003", "ARG004", # unused arguments of functions, class and static methods
]

[lint.mccabe]
max-complexity = 15
