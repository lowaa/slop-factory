# Response headers every reply from this origin carries. Included at server
# level and again in each location that sets its own add_header: nginx
# drops every inherited add_header from a location that declares one of its
# own, so a location with only Cache-Control would otherwise go out bare.
#
# `always` so error responses (401/403/404/5xx) carry them too; an error
# page is as frameable as any other.
#
# The CSP needs no 'unsafe-inline': Vite emits the bundles as external
# files, and React applies `style` props through the CSSOM, which CSP does
# not govern. img-src/font-src allow data: because Vite inlines small
# assets as data URIs. form-action also names GitHub's website (see nginx.conf.template). frame-ancestors (with X-Frame-Options for older
# browsers) is the clickjacking defence; SameSite=Lax cookies alone don't
# stop a framed page acting as the signed-in user.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action $csp_form_action; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# Sent over plain http here, which browsers ignore; it takes effect once the
# TLS-terminating proxy in front relays it over https. No includeSubDomains
# or preload: this host has no subdomains of its own, and preload is hard
# to undo.
add_header Strict-Transport-Security "max-age=31536000" always;
