{{- include "slop-haus.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- $pg := .Values.postgresql }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slop-haus.secretName" . }}
  labels:
    {{- include "slop-haus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $s.databaseUrl }}
  DATABASE_URL: {{ $s.databaseUrl | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" ($pg.username | urlquery) ($pg.password | urlquery) (include "slop-haus.postgresName" .) $pg.database | quote }}
  {{- end }}
  {{- if $pg.enabled }}
  POSTGRES_PASSWORD: {{ $pg.password | quote }}
  {{- end }}
  APP_DB_PASSWORD: {{ $s.appDbPassword | quote }}
  JWT_SECRET: {{ $s.jwtSecret | quote }}
  {{- range $key, $value := dict "SMTP_PASS" $s.smtpPass "GITHUB_CLIENT_SECRET" $s.githubClientSecret "OIDC_CLIENT_SECRET" $s.oidcClientSecret "CREDENTIAL_ENCRYPTION_KEY" $s.credentialEncryptionKey "CREDENTIAL_ENCRYPTION_KEY_PREVIOUS" $s.credentialEncryptionKeyPrevious "INTAKE_KEY" $s.intakeKey "S3_CREDENTIALS" $s.s3Credentials }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
