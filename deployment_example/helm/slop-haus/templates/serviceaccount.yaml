{{- if .Values.serviceAccount.create }}
# None of the pods talk to the Kubernetes API; the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "slop-haus.serviceAccountName" . }}
  labels:
    {{- include "slop-haus.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
