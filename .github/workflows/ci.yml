name: ci

# Each job is a thin wrapper around a suite's own test.sh, so a run here and a
# local run are the same command. Pull requests from forks run with a
# read-only token and no secrets: nothing below needs either.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lib: [artifact-store, go-auth, go-clock, go-db, go-llm-usage, go-privacy, go-settings, go-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          # go-db's test.sh also runs ruff over its e2e suite.
          uv: ${{ matrix.lib == 'go-db' }}
      - run: ${{ matrix.lib }}/test.sh

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
          uv: "true"
      - run: slop-haus/server/test.sh

  # The repo-wide linters (knip, jscpd, shellcheck, shfmt): what
  # `lint.sh --changed` runs beside the changed projects' runners, which
  # run here in each suite's own test.sh, in the jobs above and below.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: root
      - run: dev-tools/lint/lint.sh --repo-only

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: tools
      - run: slop-haus/frontend/test.sh

  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          uv: "true"
          npm-ci: root
      # The committed OpenAPI spec and generated client must match the routes.
      - run: slop-haus/frontend/generate_api_client.sh --check
      - run: npm run typecheck -w slop-haus/frontend
      - working-directory: slop-haus/supervisor
        run: uv run --frozen pytest tests/contract

  js-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [unit, storybook]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: js-components/test.sh ${{ matrix.mode }}

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [supervisor, token]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          uv: "true"
      - run: slop-haus/${{ matrix.suite }}/test.sh

  dev-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go and uv for dev-tools/lint's go.bats and ruff.bats, which lint
      # scratch projects. Every workspace, not just the root's tools: the
      # style-check coverage tests compile SCSS with the workspaces' sass and
      # render pages and stories in Playwright's Chromium.
      - uses: ./.github/actions/setup
        with:
          go: "true"
          uv: "true"
          npm-ci: root
      - run: npx playwright install --with-deps chromium
      - run: bats/run.sh --recursive dev-tools

  slop-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          npm-ci: tools
      - run: slop-review/report/test.sh
      - run: slop-review/test.sh

  slop-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: slop-bot/test.sh
      - run: slop-bot/quality.sh

  dev-tools-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's history, for the spec that pending.txt only shrinks
          # against the merge-base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go: "true"
          shellspec: "true"
      - run: dev-tools/quality/test.sh
        env:
          QUALITY_REQUIRE_BASE: "1"
      - run: dev-tools/quality/quality.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two shards, each against a stack of its own, fit a standard runner.
      - run: slop-haus/e2e_playwright_ts/test.sh
        env:
          SHARDS: "2"
          E2E_RESULTS_OUT: ${{ github.workspace }}/e2e-results
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e-results
          retention-days: 14
          if-no-files-found: ignore

  harness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          uv: "true"
      - run: slop-haus/harness_e2e/test.sh
        env:
          HARNESS_PARALLEL: "1"

  # The deployment examples still render and validate: compose config, helm
  # lint, and the chart's and Argo CD's manifests against their schemas.
  deployment-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deployment_example/test.sh

  # The host-side suites again on an Apple-silicon Mac: with only Linux above,
  # a GNU-only flag or a /proc read passes here and breaks a Mac developer's
  # run (CONTRIBUTING.md, macOS). GitHub's macOS runners have no Docker, so
  # only what runs without it: the Docker suites stay Linux-only.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: supervisor
            uv: "true"
            run: slop-haus/supervisor/test.sh
          - suite: token
            uv: "true"
            run: slop-haus/token/test.sh
          - suite: slop-review
            go: "true"
            npm-ci: tools
            run: slop-review/report/test.sh && slop-review/test.sh
          # The Go libraries whose tests need no database (go-db, go-privacy
          # and go-settings run Postgres in Docker). One runner for the five,
          # each run whatever the one before did, so one red hides nothing.
          - suite: go-libraries
            go: "true"
            run: >-
              failed=();
              for lib in artifact-store go-auth go-clock go-llm-usage go-web; do "${lib}/test.sh" || failed+=("${lib}"); done;
              if ((${#failed[@]})); then echo "failed: ${failed[*]}"; exit 1; fi
          # dev-tools' own tests, found rather than listed so a new one runs
          # here too, less those that need Docker (shell.bats runs shellcheck
          # and shfmt from images, reap_lib.bats real containers), ts.bats
          # (oxlint needs every workspace's npm ci) and coverage.bats
          # (Playwright's Chromium).
          - suite: dev-tools
            go: "true"
            uv: "true"
            npm-ci: tools
            # An empty list fails rather than passing with no tests run.
            run: >-
              find dev-tools -name '*.bats'
              ! -name shell.bats ! -name reap_lib.bats ! -name ts.bats ! -name coverage.bats
              | sort > "${RUNNER_TEMP}/bats_files"
              && test -s "${RUNNER_TEMP}/bats_files"
              && tr '\n' '\0' < "${RUNNER_TEMP}/bats_files" | xargs -0 bats/run.sh
    name: macos (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: ${{ matrix.go || 'false' }}
          uv: ${{ matrix.uv || 'false' }}
          npm-ci: ${{ matrix.npm-ci || 'none' }}
      # What a Mac developer installs too (CONTRIBUTING.md): /bin/bash is 3.2,
      # and macOS has no flock, which the supervisor's and token's tests use.
      - run: brew install bash flock
      - run: ${{ matrix.run }}

  # Images for main only once every job above but macos has passed, so the
  # cluster never gets a build ci failed. macos is advisory: it catches what
  # breaks a Mac developer, not what the images run. Pull requests skip it, and theirs have no
  # packages: write token to give it anyway.
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-libraries, server, lint, frontend, api-client, js-components, python, dev-tools, slop-review, slop-bot, dev-tools-quality, e2e, harness-e2e, deployment-example]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish_images.yml
