name: ci

# Each job is a thin wrapper around a suite's own test.sh, so a run here and a
# local run are the same command. Pull requests from forks run with a
# read-only token and no secrets: nothing below needs either.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# slop-haus is defunct, replaced by slop-bot: its suites (server, frontend,
# api-client, the Python supervisor and token, e2e, harness-e2e, the
# deployment examples) and its image publishing no longer run here.
jobs:
  go-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lib: [artifact-store, go-auth, go-clock, go-db, go-llm-usage, go-privacy, go-settings, go-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          # go-db's test.sh also runs ruff over its e2e suite.
          uv: ${{ matrix.lib == 'go-db' }}
      - run: ${{ matrix.lib }}/test.sh

  # The repo-wide linters (knip, jscpd, shellcheck, shfmt): what
  # `lint.sh --changed` runs beside the changed projects' runners, which
  # run here in each suite's own test.sh, in the jobs above and below.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: root
      - run: dev-tools/lint/lint.sh --repo-only

  js-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [unit, storybook]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: js-components/test.sh ${{ matrix.mode }}

  dev-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go and uv for dev-tools/lint's go.bats and ruff.bats, which lint
      # scratch projects. Every workspace, not just the root's tools: the
      # style-check coverage tests compile SCSS with the workspaces' sass and
      # render pages and stories in Playwright's Chromium.
      - uses: ./.github/actions/setup
        with:
          go: "true"
          uv: "true"
          npm-ci: root
      - run: npx playwright install --with-deps chromium
      - run: bats/run.sh --recursive dev-tools

  slop-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          npm-ci: tools
          shellspec: "true"
      - run: slop-review/report/test.sh
      - run: slop-review/test.sh

  # slop-bot's lint and tests, and its quality ratchet, as two jobs on their
  # own runners: quality.sh runs the tests again for coverage, so serial
  # they'd take twice as long.
  slop-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: slop-bot/test.sh

  slop-bot-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: slop-bot/quality.sh

  # slop-bot's tier 1 in a container with git, tmux and a second uid
  # (tier1/Dockerfile): a clean Linux, unprivileged and offline, unlike the
  # runner test.sh runs on.
  slop-bot-tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: slop-bot/tier1.sh

  # slop-bot on a Mac, advisory (plan 10.2): the peer-credential check
  # (LOCAL_PEERCRED), launchd, the $TMPDIR socket path limit and the BSD tools
  # only run for real here. continue-on-error keeps a red run from blocking a
  # merge, so the result is in the job summary rather than the check's colour.
  # No lint: test.sh's linters run in Docker, which these runners lack, and
  # the ubuntu job covers them.
  slop-bot-macos:
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      # tmux for the session host's tests; bash because /bin/bash is 3.2.
      - run: brew install tmux bash
      - name: Build and vet
        working-directory: slop-bot
        run: go build ./... && go vet ./...
      - name: Test
        working-directory: slop-bot
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test -race -count=1 ./... 2>&1 | tee "${RUNNER_TEMP}/slop_bot_macos.log" || status=$?
          {
            echo "### slop-bot on macOS (advisory): $([[ ${status} == 0 ]] && echo passed || echo FAILED)"
            if [[ ${status} != 0 ]]; then
              echo '```'
              grep -E '^(--- FAIL|FAIL|panic)' "${RUNNER_TEMP}/slop_bot_macos.log" | head -50
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

  dev-tools-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's history, for the spec that pending.txt only shrinks
          # against the merge-base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go: "true"
          shellspec: "true"
      - run: dev-tools/quality/test.sh
        env:
          QUALITY_REQUIRE_BASE: "1"
      - run: dev-tools/quality/quality.sh

  # The mutation tool's own tests; the mutation runs themselves are in
  # mutation.yml, never on a pull request.
  dev-tools-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          shellspec: "true"
      - run: dev-tools/mutation/test.sh
      - run: dev-tools/mutation/quality.sh

  # The host-side suites again on an Apple-silicon Mac: with only Linux above,
  # a GNU-only flag or a /proc read passes here and breaks a Mac developer's
  # run (CONTRIBUTING.md, macOS). GitHub's macOS runners have no Docker, so
  # only what runs without it: the Docker suites stay Linux-only.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: slop-review
            go: "true"
            npm-ci: tools
            shellspec: "true"
            run: slop-review/report/test.sh && slop-review/test.sh
          # quality_lib.sh is host-side shell every project's quality.sh runs.
          - suite: dev-tools-quality
            go: "true"
            shellspec: "true"
            run: dev-tools/quality/test.sh
          # The Go libraries whose tests need no database (go-db, go-privacy
          # and go-settings run Postgres in Docker). One runner for the five,
          # each run whatever the one before did, so one red hides nothing.
          - suite: go-libraries
            go: "true"
            run: >-
              failed=();
              for lib in artifact-store go-auth go-clock go-llm-usage go-web; do "${lib}/test.sh" || failed+=("${lib}"); done;
              if ((${#failed[@]})); then echo "failed: ${failed[*]}"; exit 1; fi
          # dev-tools' own tests, found rather than listed so a new one runs
          # here too, less those that need Docker (shell.bats runs shellcheck
          # and shfmt from images, reap_lib.bats real containers), ts.bats
          # (oxlint needs every workspace's npm ci) and coverage.bats
          # (Playwright's Chromium).
          - suite: dev-tools
            go: "true"
            uv: "true"
            npm-ci: tools
            # An empty list fails rather than passing with no tests run.
            run: >-
              find dev-tools -name '*.bats'
              ! -name shell.bats ! -name reap_lib.bats ! -name ts.bats ! -name coverage.bats
              | sort > "${RUNNER_TEMP}/bats_files"
              && test -s "${RUNNER_TEMP}/bats_files"
              && tr '\n' '\0' < "${RUNNER_TEMP}/bats_files" | xargs -0 bats/run.sh
    name: macos (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: ${{ matrix.go || 'false' }}
          uv: ${{ matrix.uv || 'false' }}
          npm-ci: ${{ matrix.npm-ci || 'none' }}
          shellspec: ${{ matrix.shellspec || 'false' }}
      # What a Mac developer installs too (CONTRIBUTING.md): /bin/bash is 3.2.
      - run: brew install bash
      - run: ${{ matrix.run }}
