name: ci

# Each job is a thin wrapper around a suite's own test.sh, so a run here and a
# local run are the same command. Pull requests from forks run with a
# read-only token and no secrets: nothing below needs either.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lib: [artifact-store, go-auth, go-clock, go-db, go-llm-usage, go-privacy, go-settings, go-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          # go-db's test.sh also runs ruff over its e2e suite.
          uv: ${{ matrix.lib == 'go-db' }}
      - run: ${{ matrix.lib }}/test.sh

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
          uv: "true"
      - run: slop-haus/server/test.sh

  # The repo-wide linters (knip, jscpd, shellcheck, shfmt): what
  # `lint.sh --changed` runs beside the changed projects' runners, which
  # run here in each suite's own test.sh, in the jobs above and below.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: root
      - run: dev-tools/lint/lint.sh --repo-only

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: tools
      - run: slop-haus/frontend/test.sh

  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          uv: "true"
          npm-ci: root
      # The committed OpenAPI spec and generated client must match the routes.
      - run: slop-haus/frontend/generate_api_client.sh --check
      - run: npm run typecheck -w slop-haus/frontend
      - working-directory: slop-haus/supervisor
        run: uv run --frozen pytest tests/contract

  js-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [unit, storybook]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: js-components/test.sh ${{ matrix.mode }}

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [supervisor, token]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          uv: "true"
      - run: slop-haus/${{ matrix.suite }}/test.sh

  dev-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go and uv for dev-tools/lint's go.bats and ruff.bats, which lint
      # scratch projects. Every workspace, not just the root's tools: the
      # style-check coverage tests compile SCSS with the workspaces' sass and
      # render pages and stories in Playwright's Chromium.
      - uses: ./.github/actions/setup
        with:
          go: "true"
          uv: "true"
          npm-ci: root
      - run: npx playwright install --with-deps chromium
      - run: bats/run.sh --recursive dev-tools

  slop-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          npm-ci: tools
      - run: slop-review/report/test.sh
      - run: slop-review/test.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two shards, each against a stack of its own, fit a standard runner.
      - run: slop-haus/e2e_playwright_ts/test.sh
        env:
          SHARDS: "2"
          E2E_RESULTS_OUT: ${{ github.workspace }}/e2e-results
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e-results
          retention-days: 14
          if-no-files-found: ignore

  harness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          uv: "true"
      - run: slop-haus/harness_e2e/test.sh
        env:
          HARNESS_PARALLEL: "1"

  # The deployment examples still render and validate: compose config, helm
  # lint, and the chart's and Argo CD's manifests against their schemas.
  deployment-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deployment_example/test.sh

  # Images for main only once everything above passed, so the cluster never
  # gets a build ci failed. Pull requests skip it, and theirs have no
  # packages: write token to give it anyway.
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-libraries, server, lint, frontend, api-client, js-components, python, dev-tools, slop-review, e2e, harness-e2e, deployment-example]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish_images.yml
