name: publish-images

# Builds the images the cluster runs and pushes them to ghcr.io:
#   sha-<12 hex>  every commit to main that passed ci, plus a moving `main`
#   v*            the release tag as pushed
# prune_images.yml keeps every v* and `main` and trims old sha-* tags, so a
# new tag scheme here has to be mirrored in its exclude-tags.
on:
  # ci.yml's last job, once every other job but the advisory macos one has
  # passed on a push to main.
  # Called rather than triggered by workflow_run, which would run with write
  # access on events a fork's pull request can also raise.
  workflow_call:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialised per ref, never cancelled: a cancelled run would leave a commit
# without its sha-* image. A queued run replaced by a newer one only skips an
# intermediate commit, and keeps `main` moving forward in push order.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # ci.yml only calls this on main; held here too, so no other caller can
    # publish from a branch.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: slop-haus-api
            dockerfile: slop-haus/server/Dockerfile
            target: runtime
          - name: slop-haus-frontend
            dockerfile: slop-haus/frontend/Dockerfile
            target: ""
    steps:
      - id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image.name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          if [[ "${REF_TYPE}" == tag ]]; then
            # Docker's tag alphabet, which the frontend's version stage also enforces.
            if [[ ! "${REF_NAME}" =~ ^v[A-Za-z0-9._-]{1,127}$ ]]; then
              echo "::error::tag '${REF_NAME}' is not a valid image tag" >&2
              exit 1
            fi
            build_tag="${REF_NAME}"
            tags="${image}:${build_tag}"
          else
            build_tag="sha-${SHA:0:12}"
            tags="${image}:${build_tag},${image}:main"
          fi
          {
            echo "build_tag=${build_tag}"
            echo "tags=${tags}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both Dockerfiles build from the repo root (see docker-compose-dev.yaml).
      # BUILD_TAG is what the api reports at /api/version and the frontend
      # serves as /version.json, so it is the image's own tag.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: BUILD_TAG=${{ steps.meta.outputs.build_tag }}
          # image.source links the package to this repository, which is what
          # gives this repo's workflows (prune_images.yml) access to it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.build_tag }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
