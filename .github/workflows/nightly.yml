name: nightly

# The long or drifting suites: too slow, or too dependent on upstream
# releases, to gate a pull request. A failure here is a signal to look, not a
# broken main.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
      - run: slop-haus/server/test.sh ./internal/landing -run TestSoak -v -count=1 -timeout 50m

  e2e-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: slop-haus/e2e_playwright_ts/test.sh
        env:
          SCALE: "1"

  harness-e2e-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          uv: "true"
      # Each harness at its latest release instead of its pin: what the next
      # bump will break, found before making it.
      - run: slop-haus/harness_e2e/test.sh
        env:
          HARNESS_LATEST: "1"
          HARNESS_PARALLEL: "1"
