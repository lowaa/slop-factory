version: 2
# Each ecosystem gets one grouped pull request a week for patch and minor
# updates; a major update comes as its own pull request, since each needs its
# own migration and review. The cooldown leaves a new release two weeks to be
# pulled if it turns out to be bad or compromised.
updates:
  # The workflows pin every action to a commit SHA, so nothing else moves them.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # Every Go module, the lint tools' (dev-tools/lint/go.mod) among them. A
  # lint tool bump can change what it reports: regenerate the baselines it
  # moves in the same pull request (dev-tools/lint/README.md).
  - package-ecosystem: gomod
    directories:
      - /artifact-store
      - /dev-tools/lint
      - /dev-tools/quality
      - /go-auth
      - /go-clock
      - /go-db
      - /go-llm-usage
      - /go-privacy
      - /go-settings
      - /go-web
      - /slop-bot
      - /slop-haus/server
      - /slop-review
      - /slop-review/report
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The root lockfile resolves every npm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The types follow the Node the repo runs (22, in CI and the images);
      # a newer major describes APIs that Node does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript 7's package has no JS compiler API, which openapi-typescript,
      # Storybook's docgen and our own AST tools need: 7 type-checks through
      # the typescript-native alias instead (the "//" note in package.json).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
